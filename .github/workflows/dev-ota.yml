name: Kover Dev OTA

# Builds the signed side-by-side "Kover Dev" APK (`com.rodonisi.kover.dev`)
# for arm64-v8a (Pixel 10 Pro XL / Pixel 6 Pro) from the synthesized `dev-ota`
# branch (which mirrors local `main`'s exact tree on top of `upstream/main`
# without pushing unsubmitted branch commit objects or triggering upstream
# issue cross-references) and publishes a GitHub Release for Obtainium.

on:
  push:
    branches:
      - dev-ota
  workflow_dispatch:

concurrency:
  group: dev-ota-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-dev-ota:
    name: Build Kover Dev APK (arm64-v8a) & Publish OTA Release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: "gradle"

      - name: Get FVM Configuration
        uses: kuhnroyal/flutter-fvm-config-action@v3
        id: fvm-config-action

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm-config-action.outputs.FLUTTER_VERSION }}
          channel: ${{ steps.fvm-config-action.outputs.FLUTTER_CHANNEL }}
          cache: true

      - name: Compute Obtainium OTA version and release notes
        id: meta
        run: |
          RAW=$(grep '^version:' pubspec.yaml | sed 's/version: *//' | tr -d '\r')
          VERSION_NAME=""
          RAW_TAG=$(git ls-remote --tags --refs "https://github.com/rodonisi/kover.git" 2>/dev/null | awk '{print $2}' | sed 's|^refs/tags/||' | grep -E '^[vV]?([0-9]+\.[0-9]+\.[0-9]+)(-[0-9]+)?$' | sort -V | tail -n 1 || true)
          if [ -n "$RAW_TAG" ]; then
            VERSION_NAME=$(echo "$RAW_TAG" | sed -E 's/^[vV]?([0-9]+\.[0-9]+\.[0-9]+)(-[0-9]+)?$/\1/')
          fi
          if [ -z "$VERSION_NAME" ]; then
            VERSION_NAME="${RAW%%+*}"
          fi
          [ -z "$VERSION_NAME" ] && VERSION_NAME="0.0.0"

          BUILD_NUMBER="${GITHUB_RUN_NUMBER}"
          BUILD_NAME="${VERSION_NAME}-dev.${GITHUB_RUN_NUMBER}"
          TAG="v${BUILD_NAME}"
          COMMIT_MSG=$(git log -1 --format='%B' HEAD)
          MAIN_SHA=$(echo "$COMMIT_MSG" | sed -n 's/.*\[main:\([0-9a-f]*\)\].*/\1/p')
          [ -z "$MAIN_SHA" ] && MAIN_SHA=$(git rev-parse --short=8 HEAD)

          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "build_number=${BUILD_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "build_name=${BUILD_NAME}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "main_sha=${MAIN_SHA}" >> "$GITHUB_OUTPUT"

          {
            echo "## Kover Dev OTA (\`${TAG}\`)"
            echo "- **Package:** \`com.rodonisi.kover.dev\` (**Kover Dev** · \`arm64-v8a\`)"
            echo "- **Base version:** \`${VERSION_NAME}\` (\`${RAW}\`) · **Local \`main\` snapshot:** \`${MAIN_SHA}\`"
            echo ""
            echo "$COMMIT_MSG" | tail -n +2
          } > "$RUNNER_TEMP/release-notes.md"

      - name: Set up Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/kover-upload-key.jks"
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=$RUNNER_TEMP/kover-upload-key.jks
          EOF

      - name: Generate Riverpod, Freezed, Chopper, Drift & L10n code
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          flutter gen-l10n

      - name: Build Kover Dev arm64-v8a release APK
        env:
          BUILD_NAME: ${{ steps.meta.outputs.build_name }}
          BUILD_NUMBER: ${{ steps.meta.outputs.build_number }}
        run: |
          flutter build apk \
            --release \
            --build-name="$BUILD_NAME" \
            --build-number="$BUILD_NUMBER" \
            --target-platform android-arm64 \
            --split-per-abi
          mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "kover-${BUILD_NAME}-arm64-v8a.apk"

      - name: Publish GitHub Release for Obtainium OTA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          MAIN_SHA: ${{ steps.meta.outputs.main_sha }}
          BUILD_NAME: ${{ steps.meta.outputs.build_name }}
          VERSION_NAME: ${{ steps.meta.outputs.version_name }}
        run: |
          APK="kover-${BUILD_NAME}-arm64-v8a.apk"
          if [ ! -f "$APK" ]; then
            echo "Expected APK $APK not found"
            ls -la build/app/outputs/flutter-apk/ || true
            exit 1
          fi
          echo "Publishing $APK to release $TAG..."

          if gh release view "$TAG" &>/dev/null; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" \
              --title "Kover Dev ${TAG} (${MAIN_SHA})" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --latest
          fi

          # Prune stale v*-dev.* GitHub releases (semver prefix != v${VERSION_NAME}-dev. or beyond 5 newest)
          PREFIX="v${VERSION_NAME}-dev."
          ALL_DEV_RELEASES=$(gh release list --limit 100 --json tagName --jq '.[].tagName' 2>/dev/null | grep -E '^v.*-dev\.[0-9]+$' || true)
          KEPT_COUNT=0
          for rtag in $ALL_DEV_RELEASES; do
            case "$rtag" in
              "$PREFIX"*)
                KEPT_COUNT=$((KEPT_COUNT + 1))
                if [ "$KEPT_COUNT" -gt 5 ]; then
                  echo "Pruning excess dev OTA release (>5): $rtag"
                  gh release delete "$rtag" --cleanup-tag --yes || true
                fi
                ;;
              *)
                echo "Pruning stale dev OTA release (semver mismatch != $PREFIX): $rtag"
                gh release delete "$rtag" --cleanup-tag --yes || true
                ;;
            esac
          done

          # Prune orphaned remote refs/tags/v*-dev.* tags
          SURVIVING_RELEASES=$(gh release list --limit 100 --json tagName --jq '.[].tagName' 2>/dev/null || true)
          REMOTE_DEV_TAGS=$(git ls-remote --tags --refs origin 'refs/tags/v*-dev.*' 2>/dev/null | awk '{print $2}' | sed 's|^refs/tags/||' || true)
          for rtag in $REMOTE_DEV_TAGS; do
            if ! echo "$SURVIVING_RELEASES" | grep -qx "$rtag"; then
              echo "Pruning orphaned remote tag: $rtag"
              git push origin --delete "refs/tags/$rtag" || true
            fi
          done
